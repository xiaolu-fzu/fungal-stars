<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>真菌星域 · 生长吞并</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#f3f4f0;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b2f35;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
#cv{display:block;touch-action:none}#hint{position:fixed;left:12px;top:12px;font-size:12px;color:#7d8894;z-index:5;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:6px 10px;pointer-events:none}
#panel{position:fixed;left:12px;bottom:12px;z-index:5;width:min(460px,48vw);background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:14px 18px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#panel h3{margin-bottom:8px;color:#2f6b47;font-size:16px}
#panel .info{font-size:13px;line-height:1.7;color:#5a636e}
#panel .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#panel button{background:#eef6f0;color:#1f4a33;border:1px solid #9cc9ae;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer}
#panel button:hover{background:#ddeee3}
#panel .qty{margin-top:12px;font-size:13px;color:#5a636e;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel b#q{color:#f5c542;font-size:20px;min-width:34px;text-align:center}
#panel .hint{font-size:11px;color:#8a939c;margin-top:6px}
#panel .p-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#panel .p-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.5)}
#panel .p-name{font-weight:800;font-size:16px;letter-spacing:.02em}
#panel .p-attrs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#panel .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:16px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
#panel .chip b{font-size:15px;font-weight:800}
#panel .c-en{color:#f5c542}
#panel .c-st{color:#ff8a6b}
#panel .c-sp{color:#7fb2ff}
#panel .p-hp{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#panel .hp-l{font-size:12px;color:#9aa0ab;min-width:30px}
#panel .hp-bar{flex:1;height:11px;border-radius:6px;background:rgba(0,0,0,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
#panel .hp-bar i{display:block;height:100%;border-radius:6px;transition:width .2s}
#panel .hp-n{font-size:13px;font-weight:700;min-width:74px;text-align:right;color:#24292f}
#panel .p-line{font-size:12.5px;color:#6a737d;margin:3px 0;line-height:1.55}
#panel .p-line b{color:#24292f}
#panel .p-hint{font-size:11px;color:#8a939c;margin-top:8px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px}
#status{position:fixed;top:12px;right:12px;z-index:5;font-size:12px;color:#7d8894;background:rgba(5,7,12,.6);border-radius:8px;padding:6px 10px}
#over{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,5,9,.82);z-index:6}
#over .box{text-align:center}#over h1{font-size:34px;margin-bottom:8px}#over p{color:#9aa0ab;margin-bottom:16px}
#over button{background:#f5b942;color:#181a14;border:none;border-radius:9px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer}
#err{position:fixed;inset:auto 12px 12px 12px;display:none;background:rgba(24,10,10,.94);border:1px solid rgba(255,107,94,.5);border-radius:10px;padding:12px 16px;z-index:9}
#err h2{color:#ff6b5e;font-size:13px;margin-bottom:5px}#err p{font-size:12px;color:#f3d9d6;word-break:break-word}
#sub{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:6;max-width:min(680px,92vw);text-align:center;font-size:17px;line-height:1.65;color:#eaf2f4;background:rgba(6,10,16,.74);border:1px solid rgba(140,220,170,.28);border-radius:12px;padding:13px 22px;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#sub.show{opacity:1}
#sub.alert{color:#ffb1a2;border-color:rgba(255,90,80,.42);background:rgba(30,9,9,.86)}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hint">点击我方星球选中（长按/单击选择派遣数量）→ 点目标星球派遣 | 拖动平移 · 滚轮缩放 · 右键取消 | 播放字幕时不可移动屏幕</div>
<div id="sub"></div><div id="panel"></div><div id="status"></div><div id="over"></div><div id="err"></div>
<script>function showErr(m){var e=document.getElementById('err');if(e){e.style.display='block';e.innerHTML='<h2>出错了</h2><p>'+String(m).replace(/</g,'&lt;')+'</p>';}}window.addEventListener('error',ev=>showErr((ev.message||'未知')+(ev.filename?' → '+ev.filename+':'+(ev.lineno||'?'):'')));window.addEventListener('unhandledrejection',ev=>showErr((ev.reason&&(ev.reason.message||ev.reason))||String(ev.reason||'Promise 拒绝')));</script>
<script src="sound.js"></script><script src="game.js"></script>
</body></html>
